name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend — Type-check + Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Type-check (tsc)
        run: npm run build
        working-directory: backend
        env:
          NODE_ENV: test

      - name: Run tests
        run: npm test
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-secret-for-testing

  frontend-ci:
    name: Frontend — Build check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/recursero-digital/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/recursero-digital

      - name: Build
        run: npm run build
        working-directory: frontend/recursero-digital
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
